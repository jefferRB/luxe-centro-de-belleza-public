name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions pinned to commit SHAs (tag in the comment); update them together on purpose.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 24.7+ provides native Argon2id (see package.json engines).
          node-version: '24'
          cache: npm
      - run: npm ci
      # README images exist, and production screenshots are published only with recorded authorization.
      - run: npm run verify:publication
      - run: npm run check
      - run: npm test
      # postbuild runs scripts/verify-build.ts (media policy, links, no admin in the static output).
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # `astro dev --background` on http://localhost:4321, used by the e2e suite.
      - run: npm run dev
      - run: npm run test:e2e
      - name: Stop local dev server
        if: always()
        run: npx astro dev stop
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
